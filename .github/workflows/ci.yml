name: CI

# Runs on every branch push (PR checks show up for the pushed commit).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  linux:
    name: Linux - backend tests + frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend lint + tests
        working-directory: backend
        env:
          VIDEOSTUDIO_REQUIRE_FFMPEG: "1"
          VIDEOSTUDIO_REQUIRE_TESSERACT: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr
          uv sync --locked
          uv run ruff check .
          uv run pytest -q

      - name: Build sidecar + render smoke test (Linux)
        run: |
          ./scripts/build-sidecar.sh
          du -sh apps/desktop/src-tauri/binaries/backend
          cd backend
          uv run python tests/fixtures/make_fixtures.py "$RUNNER_TEMP/fixtures"
          uv run python ../scripts/smoke_sidecar.py \
            ../apps/desktop/src-tauri/binaries/backend/videostudio-backend --render \
            --documents "$RUNNER_TEMP/fixtures" --publish

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Frontend typecheck + lint + test + build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev build-essential pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo check (Tauri shell)
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

  windows:
    name: Windows - tests + sidecar + NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Download FFmpeg
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Download Tesseract OCR
        run: ./scripts/fetch-tesseract.ps1

      - name: Backend tests
        working-directory: backend
        env:
          VIDEOSTUDIO_REQUIRE_FFMPEG: "1"
          VIDEOSTUDIO_REQUIRE_TESSERACT: "1"
        run: |
          $env:VIDEOSTUDIO_FFMPEG_DIR = (Resolve-Path ../apps/desktop/src-tauri/binaries/ffmpeg).Path
          $env:VIDEOSTUDIO_TESSERACT_DIR = (Resolve-Path ../apps/desktop/src-tauri/binaries/tesseract).Path
          uv sync --locked
          uv run pytest -q

      - name: Generate DOCX / PDF fixtures
        working-directory: backend
        run: uv run python tests/fixtures/make_fixtures.py "$env:RUNNER_TEMP\fixtures"

      - name: Build PyInstaller onedir sidecar
        run: ./scripts/build-sidecar.ps1

      - name: Smoke-test sidecar (render, DOCX/PDF/OCR ingest, mock publish)
        working-directory: backend
        run: uv run python ../scripts/smoke_sidecar.py ../apps/desktop/src-tauri/binaries/backend/videostudio-backend.exe --render --documents "$env:RUNNER_TEMP\fixtures" --publish

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles nsis

      - name: Installer size
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $mb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.Name) $mb MB"
          "### Installer: ``$($installer.Name)`` — $mb MB" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: VideoStudio-windows-x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Install and verify installer
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/verify-installer.ps1 -Installer $installer.FullName -Fixtures "$env:RUNNER_TEMP\fixtures"
