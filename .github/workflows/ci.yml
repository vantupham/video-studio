name: CI

# Runs on every branch push (PR checks show up for the pushed commit).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  linux:
    name: Linux - backend tests + frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend lint + tests
        working-directory: backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          uv sync --locked
          uv run ruff check .
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Frontend typecheck + lint + test + build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev build-essential pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo check (Tauri shell)
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

  windows:
    name: Windows - tests + sidecar + NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Build PyInstaller onedir sidecar
        run: ./scripts/build-sidecar.ps1

      - name: Smoke-test sidecar
        working-directory: backend
        run: uv run python ../scripts/smoke_sidecar.py ../apps/desktop/src-tauri/binaries/backend/videostudio-backend.exe

      - name: Download FFmpeg
        run: ./scripts/fetch-ffmpeg.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-windows-x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Install and verify installer
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/verify-installer.ps1 -Installer $installer.FullName
