# Used only for authoring migrations from the command line, e.g.
#   uv run alembic upgrade head && uv run alembic revision --autogenerate -m "add table"
# (uses the scratch database ./dev-migrations.db, which is git-ignored)
# At runtime the app runs migrations programmatically (videostudio.db.session.run_migrations).
[alembic]
script_location = videostudio/db/migrations
sqlalchemy.url = sqlite:///./dev-migrations.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
