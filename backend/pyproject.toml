[project]
name = "videostudio-backend"
version = "0.1.0"
description = "Video Studio local backend (FastAPI sidecar)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "platformdirs>=4.3",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
    "cryptography>=43",
]

[project.scripts]
videostudio-backend = "videostudio.__main__:main"

[project.entry-points."videostudio.plugins"]
# Third-party packages can register plugins here, e.g.
# my_adapter = "my_package.plugin:register"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "ruff>=0.8",
]
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videostudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
