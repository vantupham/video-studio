[package]
name = "video-studio"
version = "0.1.0"
description = "Video Studio desktop shell"
authors = ["vantupham"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "video_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
